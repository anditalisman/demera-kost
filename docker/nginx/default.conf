server {
    listen 80;
    server_name demera.my.id www.demera.my.id localhost;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS. Referencing the upstream through a variable
    # (below) forces nginx to re-resolve "app" on every request instead of
    # caching the IP once at startup — without this, restarting the app
    # container alone (without also restarting nginx) leaves nginx pointing
    # at a dead IP and every request 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt and sitemap.xml are generated dynamically by Laravel (see
    # SeoController) — do not add exact-match location blocks for them here,
    # that would shadow the app route and 404 without ever reaching PHP.

    # Never serve private storage or documents directly.
    location ^~ /storage/private/ {
        deny all;
        return 404;
    }

    # MinIO/S3 object storage, reverse-proxied so browser-facing asset and
    # presigned-document URLs stay on this HTTPS domain instead of pointing
    # at MinIO's internal-only Docker hostname (unreachable from a visitor's
    # browser) or a raw port exposed over plain HTTP (mixed-content/blocked).
    # Bucket names must match OBJECT_STORAGE_BUCKET_PUBLIC/PRIVATE in .env.
    # The private bucket has anonymous access disabled at the MinIO level
    # (see minio-init in docker-compose.yml), so only valid presigned URLs
    # from PrivateDocumentUrlService actually resolve here.
    location ^~ /demera-public/ {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;
    }

    location ^~ /demera-private/ {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
