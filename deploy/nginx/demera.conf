# Non-Docker Nginx vhost for Demera (production).
# Install to /etc/nginx/sites-available/demera.conf and symlink into
# sites-enabled, or copy to /etc/nginx/conf.d/demera.conf.
#
# Assumes PHP-FPM is reachable over a Unix socket at
# /run/php/php8.4-fpm.sock — adjust fastcgi_pass if your distro uses a
# different socket path or TCP (127.0.0.1:9000).

server {
    listen 80;
    server_name demera.my.id www.demera.my.id;

    # Redirect all HTTP to HTTPS once TLS is provisioned (e.g. via certbot).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demera.my.id www.demera.my.id;

    ssl_certificate     /etc/letsencrypt/live/demera.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demera.my.id/privkey.pem;

    root /var/www/demera/public;
    index index.php;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve private storage or documents directly.
    location ^~ /storage/private/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
