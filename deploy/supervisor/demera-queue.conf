; Non-Docker Supervisor config for the Demera queue worker.
; Install to /etc/supervisor/conf.d/demera-queue.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start demera-queue:*

[program:demera-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/demera
command=php artisan queue:work redis --queue=default,notifications --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=2
user=www-data
stopwaitsecs=60
stdout_logfile=/var/log/demera/queue.log
stderr_logfile=/var/log/demera/queue-error.log
