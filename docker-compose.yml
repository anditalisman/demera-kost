name: demera

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: demera/app:latest
    container_name: demera_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailserver:
        condition: service_healthy
    networks: [demera]

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-prod
    image: demera/nginx:latest
    container_name: demera_nginx
    restart: unless-stopped
    environment:
      - MINIO_API_PORT=${MINIO_API_PORT:-9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    networks: [demera]

  mysql:
    image: mysql:8.0
    container_name: demera_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-demera}
      MYSQL_USER: ${DB_USERNAME:-demera}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [demera]

  redis:
    image: redis:7-alpine
    container_name: demera_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [demera]

  minio:
    image: minio/minio:latest
    container_name: demera_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demera_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demera_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [demera]

  minio-init:
    image: minio/mc:latest
    container_name: demera_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-demera_minio} ${MINIO_ROOT_PASSWORD:-demera_minio_secret} &&
      mc mb -p local/${MINIO_BUCKET_PUBLIC:-demera-public} &&
      mc mb -p local/${MINIO_BUCKET_PRIVATE:-demera-private} &&
      mc anonymous set download local/${MINIO_BUCKET_PUBLIC:-demera-public} &&
      mc anonymous set none local/${MINIO_BUCKET_PRIVATE:-demera-private} &&
      exit 0
      "
    networks: [demera]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: demera/app:latest
    container_name: demera_queue
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications", "--sleep=3", "--tries=3"]
    networks: [demera]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: demera/app:latest
    container_name: demera_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    networks: [demera]

  # Watches Traefik's own ACME storage (Dokploy's Traefik already obtains
  # Let's Encrypt certs for demera.my.id/mail.demera.my.id — the "nginx"
  # service's demera-smtp-cert router above gets one issued for
  # smtp.demera.my.id the same way) and dumps it to individual PEM files
  # mailserver can read, since docker-mailserver doesn't speak Traefik's
  # acme.json format directly. Re-dumps hourly to pick up renewals.
  certs-dumper:
    image: ldez/traefik-certs-dumper:latest
    container_name: demera_certs_dumper
    restart: unless-stopped
    environment:
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-smtp.demera.my.id}
    volumes:
      - /etc/dokploy/traefik/dynamic/acme.json:/acme.json:ro
      - mail_certs:/output
    # traefik-certs-dumper's own output filenames (certificate.crt /
    # privatekey.key) don't match what docker-mailserver looks for
    # (fullchain.pem / privkey.pem under /etc/letsencrypt/live/<domain>/)
    # — dump to a scratch subdir first, then copy into the exact names/path
    # docker-mailserver requires.
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          traefik-certs-dumper file --version v2 --source /acme.json --dest /output/_raw --domain-subdir
          if [ -f "/output/_raw/${MAIL_HOSTNAME}/certificate.crt" ]; then
            mkdir -p "/output/${MAIL_HOSTNAME}"
            cp "/output/_raw/${MAIL_HOSTNAME}/certificate.crt" "/output/${MAIL_HOSTNAME}/fullchain.pem"
            cp "/output/_raw/${MAIL_HOSTNAME}/privatekey.key" "/output/${MAIL_HOSTNAME}/privkey.pem"
          fi
          sleep 3600
        done

  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: demera_mailserver
    hostname: ${MAIL_HOSTNAME:-smtp.demera.my.id}
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-25}:25"
      - "${MAIL_SUBMISSION_PORT:-587}:587"
      - "${MAIL_SUBMISSIONS_PORT:-465}:465"
      - "${MAIL_IMAPS_PORT:-993}:993"
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - mail_certs:/etc/letsencrypt/live:ro
    environment:
      - OVERRIDE_HOSTNAME=${MAIL_HOSTNAME:-smtp.demera.my.id}
      - PERMIT_DOCKER=network
      - SSL_TYPE=letsencrypt
      - ONE_DIR=1
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_OPENDKIM=1
      - ENABLE_OPENDMARC=1
    cap_add:
      - NET_ADMIN
    depends_on:
      - certs-dumper
    healthcheck:
      test: ["CMD", "nc", "-z", "-w1", "127.0.0.1", "25"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # Deliberately NOT on dokploy-network: any container attached to both
    # this bridge network and the Traefik overlay network gets its requests
    # to other "demera" peers mishandled at the application layer (see the
    # nginx->MinIO proxy fix for the fully diagnosed root cause) — mailserver
    # never needs Traefik routing anyway, so it just stays off that network.
    networks: [demera]

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: demera_webmail
    restart: unless-stopped
    environment:
      # 10.20.31.1 is the gateway of the "default" network below (a container
      # on a Docker bridge network can always reach the host through its
      # gateway IP, which routes to the host's published ports) — NOT
      # host.docker.internal: that resolves to the system default bridge's
      # gateway (172.17.0.1) regardless of which networks this container is
      # actually on, and this container was never attached to that network,
      # so connections to it silently failed ("Connection to storage server
      # failed" in Roundcube). Confirmed working directly before wiring it
      # in. See mailserver's network comment for why this goes via the host
      # at all instead of the internal "demera" network.
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://10.20.31.1
      - ROUNDCUBEMAIL_DEFAULT_PORT=${MAIL_IMAPS_PORT:-993}
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://10.20.31.1
      - ROUNDCUBEMAIL_SMTP_PORT=${MAIL_SUBMISSION_PORT:-587}
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
    volumes:
      - webmail_data:/var/roundcube/db
      - ./docker/webmail/tls-verify-override.sh:/entrypoint-tasks/post-setup/10-tls-verify-override.sh:ro
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.demera-webmail-web.rule=Host(`${MAIL_WEBMAIL_DOMAIN:-mail.demera.my.id}`)
      - traefik.http.routers.demera-webmail-web.entrypoints=web
      - traefik.http.services.demera-webmail-web.loadbalancer.server.port=80
      - traefik.http.routers.demera-webmail-web.service=demera-webmail-web
      - traefik.http.routers.demera-webmail-web.middlewares=redirect-to-https@file
      - traefik.http.routers.demera-webmail-websecure.rule=Host(`${MAIL_WEBMAIL_DOMAIN:-mail.demera.my.id}`)
      - traefik.http.routers.demera-webmail-websecure.entrypoints=websecure
      - traefik.http.services.demera-webmail-websecure.loadbalancer.server.port=80
      - traefik.http.routers.demera-webmail-websecure.service=demera-webmail-websecure
      - traefik.http.routers.demera-webmail-websecure.tls.certresolver=letsencrypt
      # Purely to get Traefik to obtain/renew a Let's Encrypt cert for
      # smtp.demera.my.id (mailserver's TLS cert — see certs-dumper below);
      # nobody actually browses this host, this container is just a
      # convenient (already Traefik-routed) place to hang the router.
      - traefik.http.routers.demera-smtp-cert-web.rule=Host(`${MAIL_HOSTNAME:-smtp.demera.my.id}`)
      - traefik.http.routers.demera-smtp-cert-web.entrypoints=web
      - traefik.http.services.demera-smtp-cert-web.loadbalancer.server.port=80
      - traefik.http.routers.demera-smtp-cert-web.service=demera-smtp-cert-web
      - traefik.http.routers.demera-smtp-cert-websecure.rule=Host(`${MAIL_HOSTNAME:-smtp.demera.my.id}`)
      - traefik.http.routers.demera-smtp-cert-websecure.entrypoints=websecure
      - traefik.http.services.demera-smtp-cert-websecure.loadbalancer.server.port=80
      - traefik.http.routers.demera-smtp-cert-websecure.service=demera-smtp-cert-websecure
      - traefik.http.routers.demera-smtp-cert-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
    networks:
      - dokploy-network
      - default
    depends_on:
      - mailserver

  vite:
    image: node:20-alpine
    container_name: demera_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles: ["dev-assets"]
    networks: [demera]

networks:
  demera:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.31.0/24
  dokploy-network:
    external: true

volumes:
  mysql_data:
  redis_data:
  minio_data:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  mail_certs:
  webmail_data:
